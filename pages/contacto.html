<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contacto | Club Atlético Boca Juniors</title>
    <meta name="description" content="Formulario de contacto e información de ubicación del Club Atlético Boca Juniors.">
    
    <!-- Open Graph -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://bocajuniorscoderproject.vercel.app/pages/contacto.html" />
    <meta property="og:title" content="Contacto - Boca Juniors" />
    <meta property="og:description" content="Comunicate con el Club Atlético Boca Juniors." />
    <meta property="og:image" content="../img/Bombonera1.jpg" />

    <!-- Icons & Fonts -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="shortcut icon" href="../img/Favicon.png" type="image/x-icon">
</head>

<body class="site-wrapper">

    <!-- Header dinámico -->
    <div id="site-header-container"></div>

    <main>
        <!-- Contact Form Section -->
        <section class="content-section">
            <h2>¿Tenés dudas o consultas? Contactanos</h2>
            
            <div class="boca-formulario">
                <fieldset>
                    <legend><i class="bi bi-envelope-paper-fill"></i> Formulario de Contacto</legend>
                    <form id="boca-contact-form">
                        <div class="form-group">
                            <label for="nombre">Nombre y Apellido *</label>
                            <input type="text" id="nombre" placeholder="Tu nombre completo" required>
                        </div>

                        <div class="form-group">
                            <label for="email">Correo Electrónico *</label>
                            <input type="email" id="email" placeholder="ejemplo@correo.com" required>
                        </div>

                        <div class="form-group">
                            <label for="asunto">Asunto de la Consulta *</label>
                            <select id="asunto" required>
                                <option value="consulta">Consulta General / Socios</option>
                                <option value="entradas">Entradas y Accesos a La Bombonera</option>
                                <option value="sugerencia">Sugerencia</option>
                                <option value="prensa">Prensa y Acreditaciones</option>
                                <option value="otro">Otro Motivo</option>
                            </select>
                        </div>

                        <div class="form-group">
                            <label for="mensaje">Mensaje *</label>
                            <textarea id="mensaje" placeholder="Escribí tu mensaje aquí..." required></textarea>
                        </div>

                        <div class="form-group">
                            <label class="form-checkbox">
                                <input type="checkbox" id="check">
                                <span>Deseo recibir novedades e información oficial por correo.</span>
                            </label>
                        </div>

                        <div class="form-actions">
                            <button type="submit" class="btn btn-submit">
                                <i class="bi bi-send-fill"></i> Enviar Mensaje
                            </button>
                            <button type="reset" class="btn btn-reset">
                                <i class="bi bi-arrow-counterclockwise"></i> Limpiar
                            </button>
                        </div>
                    </form>
                </fieldset>
            </div>
        </section>

        <!-- Location Map Section -->
        <section class="content-section map-box">
            <h2>Ubicación Oficial</h2>
            <p style="text-align: center; font-size: 1.2rem; color: #FFC700; font-weight: 600; margin-bottom: 1.5rem;">
                <i class="bi bi-geo-alt-fill"></i> Brandsen 805, C1161 CABA - Barrio de La Boca, Buenos Aires.
            </p>
            <div class="iframe-container map-container">
                <iframe
                    src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d3282.68453472097!2d-58.36734132341255!3d-34.63560735928372!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x95a334b6925e5473%3A0x1ca5b2748858b40d!2sEstadio%20Alberto%20J.%20Armando-%20La%20Bombonera!5e0!3m2!1ses-419!2sar!4v1700000000000!5m2!1ses-419!2sar"
                    loading="lazy" referrerpolicy="no-referrer-when-downgrade"></iframe>
            </div>
        </section>
    </main>

    <!-- Toast Notification Float -->
    <div id="toast-notification" class="toast-notification">
        <i class="bi bi-check-circle-fill"></i>
        <div>
            <strong>¡Mensaje Enviado!</strong>
            <p style="font-size: 0.85rem; margin: 0; opacity: 0.9;">Gracias por contactarte con Boca Juniors.</p>
        </div>
    </div>

    <!-- Footer dinámico -->
    <div id="site-footer-container"></div>

    <script type="module" src="/src/js/main.js"></script>
</body>

</html>
