<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Plantel Profesional | Club Atlético Boca Juniors</title>
    <meta name="description" content="Conoce el plantel profesional actual del Club Atlético Boca Juniors">
    
    <!-- Open Graph -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://bocajuniorscoderproject.vercel.app/pages/plantel.html" />
    <meta property="og:title" content="Plantel Profesional - Boca Juniors" />
    <meta property="og:description" content="Jugadores, estadísticas y fichas del plantel profesional Xeneize." />
    <meta property="og:image" content="../img/Bocaintro.jpg" />

    <!-- Icons & Fonts -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="shortcut icon" href="../img/Favicon.png" type="image/x-icon">
</head>

<body class="site-wrapper">

    <!-- Header dinámico -->
    <div id="site-header-container"></div>

    <main>
        <section class="content-section">
            <h2>Plantel Profesional</h2>

            <!-- Filter Controls -->
            <div class="filter-container">
                <div class="filter-tabs">
                    <button class="filter-btn active" data-category="todos">Todos</button>
                    <button class="filter-btn" data-category="arquero">Arqueros</button>
                    <button class="filter-btn" data-category="defensor">Defensores</button>
                    <button class="filter-btn" data-category="mediocampista">Mediocampistas</button>
                    <button class="filter-btn" data-category="delantero">Delanteros</button>
                </div>
                <div class="search-box">
                    <i class="bi bi-search"></i>
                    <input type="text" id="player-search" placeholder="Buscar por nombre o N°...">
                </div>
            </div>

            <!-- Dynamic Players Grid -->
            <div id="players-grid" class="cards-grid">
                <!-- Se renderizan dinámicamente con JS -->
            </div>
        </section>
    </main>

    <!-- Modal de Ficha de Jugador -->
    <div id="player-modal" class="modal-backdrop">
        <div class="modal-card">
            <button id="modal-close" class="modal-close" aria-label="Cerrar modal">
                <i class="bi bi-x"></i>
            </button>
            <div class="modal-header-img">
                <img id="modal-img" src="" alt="Jugador">
                <div class="modal-img-gradient"></div>
            </div>
            <div class="modal-body">
                <h3 id="modal-name" class="modal-player-name">Nombre Jugador</h3>
                <p id="modal-position" class="modal-player-pos">Posición</p>
                
                <div class="modal-stats-grid">
                    <div class="stat-item">
                        <div id="modal-matches" class="stat-val">0</div>
                        <div class="stat-lbl">Partidos</div>
                    </div>
                    <div class="stat-item">
                        <div id="modal-goals" class="stat-val">0</div>
                        <div class="stat-lbl">Goles</div>
                    </div>
                    <div class="stat-item">
                        <div id="modal-nationality" class="stat-val">-</div>
                        <div class="stat-lbl">País</div>
                    </div>
                </div>

                <p id="modal-bio" class="modal-bio">Biografía del jugador...</p>
            </div>
        </div>
    </div>

    <!-- Footer dinámico -->
    <div id="site-footer-container"></div>

    <script type="module" src="/src/js/main.js"></script>
</body>

</html>
